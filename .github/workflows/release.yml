name: Release

# Pushing a tag named like the version (e.g. 1.3.1, 1.4.0-beta) builds the zip with the BigWigs packager,
# publishes it as a GitHub release and uploads it to CurseForge.
# The tag must be the version written in the first heading of WeakAuras/CHANGELOG.md: that section becomes the
# CurseForge changelog.
# CurseForge needs the CF_API_KEY repository secret. The upload is done here, not by the packager, so the file is
# tagged with the WoW Forever game version read from "## Interface" (16001 -> 1.60.1) and never with a retail one.
# Wago is skipped until the .toc files carry "## X-Wago-ID" and the WAGO_API_TOKEN secret exists.

on:
  push:
    tags: ["*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the changelog section and the CurseForge key
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          case "$(head -n1 WeakAuras/CHANGELOG.md) " in
            "# WeakAuras Forever $TAG "*) ;;
            *) echo "::error::The first heading of WeakAuras/CHANGELOG.md is not for $TAG"; exit 1 ;;
          esac
          [ -n "$CF_API_KEY" ] || { echo "::error::The CF_API_KEY secret is missing"; exit 1; }

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: "1713094"
        run: |
          set -euo pipefail
          api=https://wow.curseforge.com/api

          zip=(.release/*.zip)
          if [ "${#zip[@]}" -ne 1 ] || [ ! -f "${zip[0]}" ]; then
            echo "::error::Expected one zip in .release, found: ${zip[*]}"; exit 1
          fi

          interface=$(sed -n 's/^## Interface: *\([0-9]*\).*/\1/p' WeakAuras/WeakAuras.toc)
          game_version="$((interface / 10000)).$((interface / 100 % 100)).$((interface % 100))"
          game_version_ids=$(curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" "$api/game/versions" \
            | jq -c --arg name "$game_version" '[.[] | select(.name == $name) | .id]')
          if [ "$game_version_ids" = "[]" ]; then
            echo "::error::CurseForge has no game version named $game_version"; exit 1
          fi

          case "$TAG" in
            *alpha*) release_type=alpha ;;
            *beta*) release_type=beta ;;
            *) release_type=release ;;
          esac

          metadata=$(jq -n \
            --arg changelog "$(awk '/^# /{n++} n==1' WeakAuras/CHANGELOG.md)" \
            --arg name "WeakAuras Forever $TAG" \
            --arg type "$release_type" \
            --argjson versions "$game_version_ids" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name, gameVersions: $versions, releaseType: $type}')

          curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" \
            --form-string "metadata=$metadata" -F "file=@${zip[0]}" \
            "$api/projects/$CF_PROJECT_ID/upload-file"
